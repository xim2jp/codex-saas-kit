# クラス・関数設計

主要なクラス／関数を詳細設計。実装の前に「何を作るか」を確定させるため。

## 1. ドメインモデル

### Shift（シフト）

```typescript
type ShiftStatus = 'draft' | 'pending' | 'confirmed' | 'cancelled';

interface Shift {
  id: ShiftId;
  staffId: StaffId;
  storeId: StoreId;
  startAt: Date;
  endAt: Date;
  status: ShiftStatus;
  position: Position;
  createdAt: Date;
  updatedAt: Date;
}

class ShiftService {
  // メソッドのシグネチャと責務を記述（実装は実装エージェントへ）
  
  /**
   * シフトを確定する。状態が pending の場合のみ可能。
   * @throws {InvalidStateError} 状態が pending 以外の場合
   */
  confirm(shiftId: ShiftId): Promise<Shift>;
  
  // ...
}
```

## 2. リポジトリインターフェース

```typescript
interface ShiftRepository {
  findById(id: ShiftId): Promise<Shift | null>;
  findByStoreInRange(storeId: StoreId, range: DateRange): Promise<Shift[]>;
  save(shift: Shift): Promise<void>;
}
```

## 3. ユースケース（Application Service）

```typescript
class GenerateShiftDraftUseCase {
  constructor(
    private shiftRepo: ShiftRepository,
    private staffRepo: StaffRepository,
    private aiClient: ClaudeClient,
  ) {}
  
  async execute(input: GenerateShiftDraftInput): Promise<Shift[]> {
    // 処理ステップを擬似コードで記述
    // 1. スタッフの希望シフトを取得
    // 2. 制約条件を組み立てる
    // 3. Claude APIで生成
    // 4. レスポンスをパース
    // 5. ドラフトとして保存
  }
}
```
```

