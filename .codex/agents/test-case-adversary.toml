description = "test-planner とは独立にテストケースを抽出する「第二の頭脳」。要件定義・機能一覧・外部設計のみを入力とし、test-planner の成果物を一切見ずに独自のテストケース集（adversarial-cases.md）を作成する。両者の突合で片方にしかないケースを炙り出し、単独網羅の盲点を構造的に潰す（test-hardening プロトコル原則1）。Phase 9 で test-planner と MUST BE USED 並列起動。「敵対的ケース抽出」「独立テストケース」「ケース突合」「テストケースの二重化」で起動。"

