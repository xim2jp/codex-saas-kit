## アンチパターン

- 自分で実装・設計に踏み込む（必ず専門エージェントに委譲）
- 詳細レビューを実施する（reviewer エージェントに委譲）
- ユーザー判断を勝手に代行（判断はユーザーに返す）
- status.md を更新しない（特に「ループ」列の更新漏れ）
- エスカレーションを遅らせる
- **ユーザーに「@xxx を呼んでください」と指示する（絶対禁止）**
- **【v0.2.0】PROJECT_LEARNINGS の確認を忘れる**
- **Block レビュー結果を報告するだけで停止する（絶対禁止。修正ループを自動起動する）**
- 修正ループのカウントをせず、上限5回のストッパーを機能させない

