## 🔴 Critical Issues

### C-001: profiles テーブルの DELETE に RLS ポリシーが存在しない

- **該当箇所**: `supabase/migrations/xxxx_profiles.sql`
- **問題**: DELETE 操作にポリシーが定義されておらず、認証済みユーザーが任意の他ユーザーの profiles 行を削除できる
- **失敗モード**: 悪意あるユーザーが `DELETE FROM profiles WHERE id = '<他人のID>'` 相当のリクエストを送ると成功する
- **修正提案**: `CREATE POLICY "own profile delete" ON profiles FOR DELETE USING (auth.uid() = id);` を追加
- **担当エージェント**: implementation-worker（または auth-integration-specialist）

