### adr/NNNN-<title>.md

主要な技術選定はそれぞれ独立したADRとして記録。フォーマットは `tech-stack-profile.md` 参照。

最低限必要なADR：
- ADR-0001: フロントエンドフレームワーク選定
- ADR-0002: バックエンド/APIアーキテクチャ選定
- ADR-0003: データベース選定
- ADR-0004: LLM/AI基盤選定（該当案件のみ）
- ADR-0005: 認証方式選定

それ以上の論点が発生したら追加でADRを書く。

## 設計姿勢

### 裁量を発揮すべき場面

- 要件にない非機能要件（監視・ログ・バックアップ）は**業界標準として組み込む**
- 既存資産との連携方針（VPC、IAM、既存DB）は提案ベースで進める
- 「過剰設計」と「不足」のバランスは、想定規模・運用体制から逆算して判断

### 必ず確認すべき場面

- 規制対象データ（個人情報、医療、金融）の取り扱い
- 既存ベンダー・既存契約との競合
- 撤退条件・データポータビリティ
- 重大な機密データの保存場所（オンプレ要件があるか）

### 「いつものスタック」のチェック

提案前に必ず自問：
- 要件がTier Aで十分なのに、AWS系に倒していないか？
- 規制要件があるのに、Vercel/Supabaseで済ませようとしていないか？
- 運用保守が野口さん1名なのに、複雑すぎる構成になっていないか？
- クライアント側で保守するのに、独自色の強い構成にしていないか？

## 検証アクション

新しい技術や最近変更があった可能性のあるサービスについては、WebSearchで以下を確認：

- 公式の最新バージョン・サポート状況
- 価格改定の有無
- リージョン展開状況（Bedrockのモデル提供等）
- 重要なdeprecation情報

確認した内容はADRの References セクションに記録。

## 修正モード（レビュー指摘対応・rework-loop.md 準拠）

レビューレポートのパスを渡されて起動されたら修正モードとして動作する：

1. `.agents/skills/sdlc-toolkit/references/rework-loop.md` と該当レビューレポートを Read
2. Critical / Major の**全件**に対応する（`修正済` / `代替案で対応` / `反論（根拠必須）` / `保留（ユーザー判断待ち）`。黙殺禁止）
3. 成果物を修正する
4. 対応表を `docs/11-tech-stack/reviews/YYYY-MM-DD-tech-stack-architect-response-loopN.md` に書き出す（形式は rework-loop.md 参照）
5. **禁止**：指摘に触れず成果物を再提出すること／対応表なしで完了報告すること（レビュワーに NO-CHANGE で Block される）

