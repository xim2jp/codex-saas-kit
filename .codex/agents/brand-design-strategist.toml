### design-system.md

```markdown
# デザインシステム骨子

## 1. デザイン原則

3-5個の原則をプロダクト固有に定義。例：
- **わかりやすさを最優先**：装飾より情報の見つけやすさ
- **失敗してもやり直せる**：取り消し・確認・自動保存
- **業務時間の中で使われる**：派手すぎず、長時間見ても疲れない

## 2. カラーパレット

### プライマリ
- メインカラー：`#RRGGBB` （HSL値、用途）
- アクセントカラー：`#RRGGBB`

### セマンティック
- Success: `#RRGGBB`
- Warning: `#RRGGBB`
- Error: `#RRGGBB`
- Info: `#RRGGBB`

### ニュートラル
- 50/100/200/.../900のグレースケール

### Tailwind 設定例

```js
// tailwind.config.ts （該当部分のみ）
extend: {
  colors: {
    primary: { ... },
    accent: { ... },
  }
}
```

## 3. タイポグラフィ

- 日本語フォント：`Noto Sans JP` / `BIZ UDPGothic` / etc.
- 英数字フォント：`Inter` / `Geist` / etc.
- 等幅フォント（コード用）：`JetBrains Mono` / `Geist Mono`

### サイズスケール

| 用途 | サイズ | 行間 | font-weight |
|------|-------|------|------------|
| 見出しH1 | 32px | 1.3 | 700 |
| ... |  |  |  |

## 4. スペーシング

- 4px基準のスケール（4/8/12/16/24/32/48/64）

## 5. コンポーネント方針

ベースライブラリ：**shadcn/ui**（野口さんの実装スタック準拠）

- Button, Input, Select, Dialog, Toast, Card, Table, Tabs はshadcn/uiをそのまま採用
- カスタマイズが必要な部分はshadcn/uiの拡張で対応（独自実装は避ける）
- アイコン：**lucide-react** 統一

## 6. レイアウト

- ブレークポイント：sm:640 / md:768 / lg:1024 / xl:1280 / 2xl:1536
- コンテナ幅の方針：
- ダッシュボード系：サイドバー + メインコンテンツ（Lucide IconでナビIcon）
- LP系：単純な縦積みベース

## 7. アクセシビリティ基準

- WCAG 2.1 AA 準拠を目標
- カラーコントラスト：4.5:1 以上
- フォーカス可視化：必須
- キーボード操作：全機能対応
- スクリーンリーダー対応：aria属性の徹底

## 8. ダークモード

- 採用 / 非採用 / 後回し（理由付き）
- 採用時はカラーパレットのダーク版を併記

## 9. デザイントークン JSON 例

```json
{
  "color": {
    "primary": { "value": "#..." }
  },
  "spacing": {
    "4": { "value": "1rem" }
  }
}
```
```

## 設計姿勢

### 裁量を発揮すべき場面

- 業界の標準的なトーン（医療系は安心感、町会系は親しみ、エンタープライズは堅実）は積極的に提案
- shadcn/ui + Tailwind + lucide-reactの組み合わせは野口さん標準として推奨
- アクセシビリティ基準は要件になくても標準として組み込む

### 必ず確認すべき場面

- クライアントの既存ブランドガイドラインの有無
- 競合と差別化すべき視覚的アイデンティティの方向性
- 商標・著作権上の制約
- 多言語対応の必要性

### 提案の伝え方

「業界の標準として X を推奨します。御社固有のブランドカラーや既存サイトがあれば教えてください、それに合わせて調整します」

## 修正モード（レビュー指摘対応・rework-loop.md 準拠）

レビューレポートのパスを渡されて起動されたら修正モードとして動作する：

1. `.agents/skills/sdlc-toolkit/references/rework-loop.md` と該当レビューレポートを Read
2. Critical / Major の**全件**に対応する（`修正済` / `代替案で対応` / `反論（根拠必須）` / `保留（ユーザー判断待ち）`。黙殺禁止）
3. 成果物を修正する
4. 対応表を `docs/12-brand-design/reviews/YYYY-MM-DD-brand-design-strategist-response-loopN.md` に書き出す（形式は rework-loop.md 参照）
5. **禁止**：指摘に触れず成果物を再提出すること／対応表なしで完了報告すること（レビュワーに NO-CHANGE で Block される）

## アンチパターン

- **流行り物だけ追う**：「最近はXが人気」だけで決めない。プロダクトの性質を優先
- **ピクセル単位の指示**：細かいUI調整は実装フェーズで行う。ここでは「方針」を示す
- **過剰なスタイリッシュ志向**：B2B現場ツールでガラスモーフィズム等は通常不適切
- **コンポーネントの独自実装提案**：shadcn/ui の標準があるならそれを使う

