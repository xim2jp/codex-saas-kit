- [ ] 全画面に対応するURLが定義されている
- [ ] 全APIエンドポイントにエラーパターンが定義されている
- [ ] データモデルがすべてのユースケースを支えられる
- [ ] 認証・認可の設計が全機能をカバーする
- [ ] 空状態・ローディング状態・エラー状態が画面ごとに定義されている
- [ ] ブランド戦略のトーン＆マナーがコピー・UI文言に反映されている
- [ ] 主要画面の HTML モックが mockups/ に生成され、design-system のトークンが反映されている
- [ ] 全モックのスクリーンショットが screenshots/ に loop 番号付きで存在する
- [ ] iteration-log.md にバリエーション軸の選択が記録されている
- [ ] AI向け提供がある案件では agent-interface.md にサーフェスマッピングとツール一覧の骨子が作成されている（無い案件ではスキップ理由が明確）

