| create_shift | シフトを1件作成する | in: 日付・時間帯・担当者 / out: 作成結果 | 認証済みユーザー（自分のテナントのみ） |
| list_shifts | 期間指定でシフト一覧を取得する | in: 期間・フィルタ / out: シフト配列（ページネーション） | 認証済みユーザー |

## 3. 設計方針

- AI向けツールは**画面のCRUD分割をそのまま複製しない**。AIが達成したいゴール単位で再設計する（詳細は mcp-server-specialist が担当）
- 権限モデルは `auth-design.md` の権限マトリクスを継承する（画面と別の権限体系を作らない）
- ツール数は「少数精鋭」を志向する。骨子段階で明らかに過多なら統合案を検討する
```

#### 設計姿勢

- 骨子表（サーフェスマッピング・ツール一覧の骨子）まで作成し、ツールの詳細スキーマ・description・OAuth設計・実装は `mcp-server-specialist` に委譲する
- AI向け提供の要否が要件・tech-stack で未確定な場合、勝手に決めずユーザーに確認する
- 画面設計とツール設計で FunctionalID の解釈がズレないよう、同じ feature-list.md を必ず起点にする

