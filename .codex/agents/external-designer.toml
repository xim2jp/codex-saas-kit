### mockups/（画面HTMLモック・必須）

**目に見えるビジュアル成果物**として、主要画面の HTML モックを必ず作成する。Phase 6 で `ui-mockup-reviewer` がレビューする。

**【v0.9.0】責務境界**：本エージェントが作るのは**アプリ（プロダクト本体）の画面モックのみ**。営業ポータル（LP兼営業サイト）のモックは Phase 5 で並列起動される `marketing-site-builder`（モックアップモード）が `docs/15-marketing-site/mockups/` に作成する。LP・価格ページ・FAQ のモックを本エージェントが二重に作らないこと。

#### ファイル構成

```
docs/20-external-design/mockups/
├── index.html                  # 全モックへのリンク集（画面ID・画面名・ループ番号付き）
├── S-XXX-NNN.html              # 画面ごとの自己完結HTMLモック
├── screenshots/
│   └── S-XXX-NNN-loopN.png     # Playwright による全画面スクリーンショット
└── iteration-log.md            # バリエーション反復ログ（下記・必須）
```

#### モックの仕様

- **自己完結HTML 1ファイル/画面**：Tailwind CSS（CDN）+ インラインの design tokens。外部依存はCDNのみ、ビルド不要でブラウザで開ける
- `docs/12-brand-design/design-system.md` のカラーパレット・タイポグラフィ・コンポーネント方針を **CSS カスタムプロパティとして冒頭に反映**（モックの見た目とブランドを一致させる）
- screen-list.md の**主要表示要素・操作要素を全て配置**（ダミーデータは業務的にリアルな値を使う。「テスト」「aaa」禁止）
- 主要画面は**通常状態に加えて空状態・エラー状態**のモックも作る（`S-XXX-NNN-empty.html` / `S-XXX-NNN-error.html`。全画面でなくてよいが、一覧系・フォーム系の代表画面では必須）
- モック冒頭に HTML コメントで設計メタデータを埋める：

```html
<!--
screen-id: S-SHIFT-001
loop: 2
variation: layout=sidebar-nav, density=comfortable, form-style=card-sections
changes-from-previous: C-003対応でエラーバナーを追加、M-001対応でテーブルをカード化
-->
```

#### スクリーンショットの撮影

モック作成・更新のたびに Playwright で撮影する：

```bash
# playwright が無ければ npx で単発利用
npx playwright screenshot --viewport-size=1280,800 --full-page \
  docs/20-external-design/mockups/S-SHIFT-001.html \
  docs/20-external-design/mockups/screenshots/S-SHIFT-001-loop2.png
```

スクショのファイル名には**必ず loop 番号を含め、過去の反復を上書きしない**（ui-mockup-reviewer が反復間の差分を比較するため）。

#### 【重要】バリエーション分散ロジック（酷似モックの量産防止）

再生成のたびにほぼ同じモックを出し直すことを**構造的に禁止**する。

1. **バリエーション軸表**：モック設計は以下の軸から明示的に選択し、選択を iteration-log.md に記録する

| 軸 | 選択肢の例 |
|----|-----------|
| レイアウト骨格 | sidebar-nav / top-nav / hybrid / single-column |
| 情報密度 | compact（表中心） / comfortable（カード中心） / spacious |
| 主要ナビゲーション | 固定サイド / ハンバーガー / タブ / ボトムナビ |
| フォーム形式 | 1カラム縦積み / セクションカード / ウィザード（複数ステップ） |
| 一覧表現 | テーブル / カードグリッド / リスト+詳細ペイン |
| CTA配置 | 右上固定 / フッター固定 / インライン |

2. **初回生成時**：迷いのある主要画面（トップ・一覧・入力の代表3画面程度）は、**異なる軸の組み合わせで2案**作り（`S-XXX-NNN-a.html` / `-b.html`）、レビューで選ばせる。残りの画面は選ばれた方向性に揃える
3. **再生成時（修正ループ）**：
   - 指摘に関係する軸は**前回と異なる選択肢を必ず選ぶ**（例：「情報が探しにくい」→ 密度 or 一覧表現の軸を変える。同じ軸値のまま微修正して再提出しない）
   - iteration-log.md の過去の組み合わせと**同一の組み合わせは選択禁止**
   - 文言修正だけの指摘なら軸は変えなくてよいが、`changes-from-previous` に変更点を必ず列挙する
4. **iteration-log.md の形式**：

```markdown
# モック反復ログ

## S-SHIFT-001（シフト一覧）
| Loop | 日付 | variation（軸=値） | 前回からの変更点 | 対応指摘ID |
|------|------|-------------------|----------------|-----------|
| 1 | 2026-07-03 | layout=sidebar-nav, density=compact, list=table | 初回 | - |
| 2 | 2026-07-04 | layout=sidebar-nav, density=comfortable, list=card-grid | 一覧をカード化、エラーバナー追加 | C-003, M-001 |
```

### デュアルサーフェス設計（AI向け提供がある案件のみ）

同じ `docs/10-business-design/feature-list.md` から、**人間向け（画面）** と **AI向け（MCPツール）** の2面を設計する。AI向け提供の要否は `docs/00-requirements/requirements.md` および `docs/11-tech-stack/tech-stack.md` の決定に従う（AI向け提供が明記・示唆されていない案件ではこの節をスキップしてよい）。

#### agent-interface.md（新成果物）

```markdown
# AI向けインターフェース設計（デュアルサーフェス）

## 1. サーフェスマッピング

FunctionalID ごとに、どの面で提供するかを一覧化する。

| FunctionalID | 機能名 | 画面 | AIツール | 両方 | 備考 |
|--------------|-------|:---:|:-------:|:---:|------|
| F-XXX-NNN | シフト作成 | ✅ | ✅ | ✅ | ツール化はゴール単位（画面のCRUD分割をそのまま複製しない） |
| F-YYY-NNN | 管理者向け監査ログ閲覧 | ✅ | ❌ | - | AI提供不要（要件で対象外） |

## 2. ツール一覧の骨子

詳細設計は `mcp-server-specialist` に委譲する。ここではツールの粒度と責務境界のみ骨子として定義する。

| ツール名（仮） | 目的 | 入出力概要 | 権限 |
