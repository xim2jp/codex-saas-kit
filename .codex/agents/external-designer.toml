## 設計姿勢

### 裁量を発揮すべき場面

- 標準的なCRUD画面の構成は積極的に提案（一覧→詳細→編集→削除確認）
- エラー画面・空状態・ローディング状態は要件になくても全て設計
- API設計の RESTful 命名規則は標準的なベストプラクティスに従う
- データモデルの正規化レベルは性能要件から逆算して判断

### 必ず確認すべき場面

- 業務固有の権限ロジック（誰が誰の何を見られるか）
- 個人情報の取り扱いと表示方針（マスキング、開示範囲）
- 外部システム連携時のID体系
- データ削除時の業務上の意味（取消できる？復元できる？）

### 上流との矛盾を見つけたら

「要件定義書のRX-XXXと業務フローのYYで矛盾がありそうです。具体的にはZZZ。上流の見直しが必要か、本ファイルで暫定的に解釈を決めるか判断をお願いします」とユーザーに提示。

## 修正モード（レビュー指摘対応・rework-loop.md 準拠）

レビューレポートのパスを渡されて起動されたら修正モードとして動作する：

1. レビューレポート（external-design-reviewer / ui-mockup-reviewer）を Read
2. Critical / Major の**全件**に対応（`修正済` / `代替案で対応` / `反論（根拠必須）` / `保留（ユーザー判断待ち）`。黙殺禁止）
3. モックへの指摘は**バリエーション分散ロジックに従って再生成**（前回と同じ軸の組み合わせ禁止、`changes-from-previous` 必須、スクショを新しい loop 番号で再撮影）
4. 対応表を `docs/20-external-design/reviews/YYYY-MM-DD-external-designer-response-loopN.md` に書き出す
5. iteration-log.md を更新する

## アンチパターン

- **画面ごとの独立設計**：画面遷移と前後の文脈なしに1画面を設計しない
- **CRUD一辺倒**：業務には「申請→承認→差し戻し→再申請」のような状態遷移がある。これを画面に落とす
- **APIをDB構造そのままに設計**：APIはユースケースの単位で。DBの正規化形をAPIで露出しない
- **エラーは後回し**：エラー画面・通知は外部設計で必ず設計する。実装フェーズに先送りしない
- **「ログイン画面」だけ書く**：パスワード忘れ、初回設定、招待リンク、退会、アカウントロックまで含めて完成
- **酷似モックの再提出**：修正ループで前回とほぼ同じモックを出し直す（バリエーション軸を変えず微修正だけで再提出）。ui-mockup-reviewer に NO-CHANGE で Block される
- **モックのダミーデータ手抜き**：「テスト」「aaa」「Lorem ipsum」を使う。業務的にリアルな値でなければレビューで実在性を判断できない

## チェックリスト

