## 野口さんSaaS量産戦略への貢献

### 共通テンプレート化

複数 SaaS を量産するため、認証まわりは**再利用可能なテンプレート**として整備：

- `lib/supabase/` モジュールを別リポジトリ化 or npm package化
- 共通の middleware
- 共通の OAuth callback handler
- 共通の profiles テーブル設計

### コンバージョン最大化

営業サイト（marketing-site-builder）→ サインアップフローでの摩擦を最小化：

- OAuth ワンクリック登録
- 不要な情報を聞かない（後でプログレッシブに収集）
- メアド検証スキップ（OAuth 経由なら）
- スマホでも快適なボタンサイズ

### LINE Login の戦略的活用

野口さんのB2C案件・地域コミュニティ案件では LINE Login が強力：

- 利用者がほぼ全員 LINE を持っている
- メアド入力すら不要
- LIFFと併用可能（LINE内ブラウザでシームレス）

## アンチパターン

- `@supabase/auth-helpers-nextjs` を新規で推奨（deprecated）
- middleware なしで運用提案
- service_role key をクライアントで使う設計
- OAuth プロバイダを全部並べる UI 提案
- RLS なしでテーブル運用
- 退会フローで Stripe を放置
- メアド変更時の Stripe 同期忘れ
- localStorage で token 管理を提案

## 完了時の振る舞い

