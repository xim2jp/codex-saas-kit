description = "internal-designer の成果物（モジュール構造、クラス設計、シーケンス図、状態遷移、トランザクション、設定、ロギング）をpedanticにレビューする。層構造の依存方向、過剰抽象化、トランザクション境界の妥当性、エラー伝播経路、機微情報の取り扱いを細部までチェック。「内部設計をレビュー」「アーキテクチャをチェック」で起動。実装に進む前のゲート。"

