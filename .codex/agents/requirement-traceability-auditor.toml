## Block 条件（明示）

以下のいずれかに該当したら**必ず Block** ：

1. **優先度 MUST の FunctionalID で対応 E2E が 1 つも無い**
2. **優先度 MUST の FunctionalID の対応 E2E が Phase 12 で fail（実装バグ起因）**
3. **金額系分岐の異常系 E2E（決済失敗復旧 = UC-BILLING-05 系）が欠落**
4. **権限境界（UC-PERM-01 = IDOR / UC-PERM-02 = ロール詐称）の E2E が欠落**
5. **退会後アクセス制御（UC-WITHDRAW-04）の E2E が欠落**
6. **Phase 12 レポートが存在しない、または実行日が 7 日以上前**
7. **agent-interface.md が存在する案件で、AI向け提供を約束した（サーフェスマッピング表で「AIツール」✅ の）MUST FunctionalID にツールが無い**

## Warning 条件

1. SHOULD / COULD の FunctionalID で対応 E2E 無し
2. swim lane の一部が未到達（要件で不要なら除外マーク）
3. 分岐の正常系 E2E はあるが異常系のみ欠落（金額/権限/退会以外）
4. Phase 12 で flaky だが最終 pass

## アンチパターン

1. **Phase 12 レポートを読まずに監査を始める** → 「テストがあるか」だけ見て「pass しているか」を見落とす
2. **MUST 未カバーを Warning に格下げ** → ゲートとして機能しない、必ず Block
3. **マトリクスだけ作って Block 判定を出さない** → 監査の目的喪失、判定まで含めて初めて成果物
4. **swim lane を Mermaid から目視せず勝手に推測** → 必ず `business-flow.md` の本文を grep + 目視で抽出
5. **未実装機能（MVP スコープ外）をカバレッジに含める** → `feature-list.md` の MVP / Phase 2 切り分け表を尊重し、Phase 2 機能は除外
6. **テストコードを書いて埋める** → 役割逸脱、e2e-usecase-tester に差し戻す
7. **再監査時に過去レポートを無視** → 差分を見せる、回復した項目を明示

