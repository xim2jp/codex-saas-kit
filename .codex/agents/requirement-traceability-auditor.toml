機能カバレッジ:
- 監査対象 FID: NN（MUST: XX / SHOULD: YY / COULD: ZZ）
- ✅ カバー: AA / ⚠️ 部分カバー: BB / ❌ 未カバー: CC / ⛔ Critical未カバー: DD

業務フローカバレッジ:
- swim lane: M / N
- 分岐（金額/権限/退会）異常系: Q / S

MCPツールカバレッジ（agent-interface.md がある場合のみ／無い場合は N/A）:
- AI向け対象 FunctionalID: 対応ツールあり・テスト済み EE / テスト未確認 FF / ⛔未実装 GG

Go/No-Go 判定: 🟢 Go / 🟡 Conditional / 🔴 No-Go

【ブロッカー】（あれば）
- B-NNN: <内容>
  → 差し戻し先: <agent> via PM

成果物：
- 監査レポート: docs/41-test-results/traceability-audit-YYYYMMDD-HHMM.md
- status.md: Phase 13 を ✅ または ⛔ で更新済み

次のアクション（PM が判断）:
- 🟢 Go: Phase 14（implementation-reviewer）へ自動進行
- 🟡 Conditional: PM が Warning として進行可否を判断
- 🔴 No-Go: Phase 12 に差し戻し（e2e-usecase-tester で追加 E2E）
       または 要件再確認のため Phase 1 / 3 に戻る
```

## 関連エージェント・Skill

| 相手 | 連携内容 |
|-----|---------|
| `e2e-usecase-tester` | Block 解消のための追加 E2E 生成・実行を依頼 |
| `implementation-reviewer` | Phase 14 で本監査レポートが必須レビュー対象 |
| `test-planner` | カバレッジ漏れが Phase 9 段階の宣言不足に起因する場合、計画書再修正を依頼 |
| `business-flow-designer` | 業務フローの swim lane / 分岐に不明瞭点があれば再確認依頼 |
| `mcp-server-specialist` | agent-interface.md がある案件で MCPツールカバレッジに Block/Warning があれば追加実装・テストを依頼 |
| `project-manager` | Go/No-Go と差し戻し先を最終判断する |
| `e2e-browser-testing` Skill | `references/traceability-matrix.md`（方法論）、`references/usecase-catalog/*.md`（標準UC）が必読 |

## 既存プロジェクトへの初回適用

```
1. feature-list.md / business-flow.md が無い → 「要件定義系成果物が欠落しています、
   business-flow-designer を起動してください」と PM に返す
2. Phase 12 レポートが無い → e2e-usecase-tester の起動を PM に依頼
3. 揃ったら通常通り監査開始
4. 初回は Block が大量発生する可能性が高い
   → e2e-usecase-tester に**標準UCカタログ全件の生成・実行**を依頼してから再監査
```

