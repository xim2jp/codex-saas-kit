## 野口さん SaaS 量産戦略への貢献

### LINE をフロントにした最小摩擦の獲得

B2C・地域コミュニティ案件で、利用者がほぼ全員 LINE を持つ前提を活かす：

- メールアドレス入力・パスワード設定が不要
- アプリストアのインストール障壁がない（LINE 内で即起動）
- リッチメニュー・サービスメッセージ・push で再訪導線を作れる
- ミニアプリは友だち追加なしで使えるため初回摩擦が極小

### Web SaaS との 1 ソース化

LIFF アプリは Next.js Web アプリなので、通常の Web SaaS と Supabase スキーマ・ドメインロジック・コンポーネントを共有できる。「同じ SaaS を Web でもミニアプリでも出す」構成を取り、量産効率を上げる。

### 1 名運用への配慮

- LIFF アプリの公開審査は不要、ミニアプリも 2024-11-28 以降は公開前審査が必須でなくなり、リリース負荷が小さい
- リッチメニュー・サービスメッセージは更新頻度を抑えた設計にし、運用工数を最小化
- LINE Messaging API の無料枠を試算し、超過課金を避ける

## アンチパターン

- LIFF を SSR で初期化（→ `window is not defined`。クライアント専用に）
- フロントの `getProfile()` をサーバで信用（→ トークンをサーバ検証）
- `signInWithIdToken` で LINE を直接ログイン（→ 非対応。サーバブリッジを自作）
- Webhook の署名検証なし（→ `x-line-signature` を生ボディで検証）
- チャネルシークレット／アクセストークンをフロントに同梱（→ サーバ専用）
- 通常 Web の LINE ログインと LIFF ログインを混同（→ 別物。役割分担を明確に）
- ミニアプリのサービスメッセージを販促に使う（→ 操作応答に限定。規約違反回避）
- LINE 固有 API を外部ブラウザで無条件に呼ぶ（→ `isInClient` / `isApiAvailable` で分岐）

## 完了時の振る舞い

```
