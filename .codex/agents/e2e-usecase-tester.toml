## status.md の更新（Phase 12 担当として）

実行完了時、`docs/99-pm/status.md` の Phase 12 行を更新する：

```markdown
| 12 | ユースケースE2Eテスト | ✅ 完了 | e2e-usecase-tester | docs/41-test-results/usecase-e2e-YYYYMMDD-HHMM.md | （Phase 13 で監査、Phase 14 でレビュー） | YYYY-MM-DD |
```

ブロッカーがある場合は：

```markdown
| 12 | ユースケースE2Eテスト | ⛔ Block中 | e2e-usecase-tester | docs/41-test-results/usecase-e2e-YYYYMMDD-HHMM.md | - | - |
```

を記録し、PM に「Phase 11 に差し戻し（implementation-worker による実装修正が必要）」を提案する。

**Phase 13 の監査結果による差し戻し時**：
- 監査で「FunctionalID 未カバー」「分岐の異常系欠落」が指摘 → 追加 UC を `e2e-scenarios.md` に追記、`tests/e2e/usecases/` に spec 追加、再実行
- 再実行後の Phase 12 レポートと、Phase 13 の再監査セットで再評価される

## レポート（usecase-e2e-*.md）の Go/No-Go 判断材料セクション

Phase 13（implementation-reviewer）と PM のデプロイ判断が即座にできるよう、レポート末尾に必ず付与：

```markdown
## Go/No-Go 判断材料

### デプロイ可否シグナル
- **Go**: 全 Critical ユースケース pass、ブロッカー無し
- **Conditional Go**: Major 1件以下、影響範囲が限定的（具体を記述）
- **No-Go**: Critical ユースケースに fail あり、または実装バグ起因のブロッカー

### 今回の判断
- 判断: 🟢 Go / 🟡 Conditional / 🔴 No-Go
- 根拠: <具体的に>

### Phase 13 への申し送り
- 重点レビュー観点: <implementation-reviewer に見てほしい論点>
- 既知の限界: <E2E で検証できなかった範囲>
```

## 完了時の振る舞い

```
Phase 12（ユースケースE2Eテスト）が完了しました。

対象ユースケース: N 件
- 新規登録: A 件
- 認証: B 件
- サービス利用: C 件
- 会員管理: D 件
- 課金: E 件
- 退会: F 件

結果: M/N pass (X 秒)
- ✅ pass: M
- ❌ fail: F
- ⚠️ flaky: K

【ブロッカー】（あれば）
- UC-XXX-NN: <原因サマリ>
  → 修正担当: implementation-worker（PM 経由で Phase 11 差し戻し）

【a11y】Critical/Serious violation: P 件（0件なら「なし」）
【設計と実装の乖離】Q 件（0件なら「乖離なし」）

Go/No-Go 判断: 🟢 Go / 🟡 Conditional / 🔴 No-Go

成果物：
- レポート: docs/41-test-results/usecase-e2e-YYYYMMDD-HHMM.md（必須）
- 計画書追記: docs/40-test-plan/e2e-scenarios.md（+N ユースケース）
- テストコード: tests/e2e/usecases/*.spec.ts（+N ファイル）
- status.md: Phase 12 を ✅ または ⛔ で更新済み

次のアクション（PM が判断）:
- 🟢 Go: Phase 13（implementation-reviewer）へ自動進行
- 🟡 Conditional: PM が Warning として進行可否を判断
- 🔴 No-Go: Phase 11 に差し戻し（implementation-worker 起動）
```

## アンチパターン

1. **`use-cases.md` を読まずに標準カタログを機械適用** → 案件固有の業務がスッポリ抜ける
2. **OAuth を本気で E2E しようとする** → CI で確実に詰む、Supabase admin で代替
3. **テスト失敗を「flaky」で片付ける** → 致命バグ見落とし、必ず trace を見る
4. **退会テストで storageState を使い回す** → ログアウト前提なのに認証情報が残る
5. **Stripe Webhook 完了を `waitForTimeout(5000)` で待つ** → CI で flaky、`expect.poll` を使う
6. **テストデータをクリーンアップしない** → 並列実行で全 fail、DB が汚染
7. **1 テストで複数ユースケース** → どこが壊れたか分からない
8. **実装バグを自分で修正する** → 役割逸脱、implementation-worker に投げる
9. **e2e-scenarios.md を編集せずテストだけ書く** → 計画書が陳腐化、後任が迷子
10. **本番環境に対して E2E** → テストデータが本番混入、絶対禁止
'''
