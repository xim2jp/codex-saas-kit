この**プレースホルダさえ書いておけば**、Phase 12 で e2e-usecase-tester が Given/When/Then を補い、テストコードを生成する。

### 【v0.2.0】「対応 FunctionalID」欄の重要性

Phase 13 の **requirement-traceability-auditor** が、`feature-list.md` の全 MUST FunctionalID に対して E2E が対応しているかを突合する。**ここで対応 FunctionalID が宣言されていないと、機械的な突合ができず、漏れが発覚しない**。

- 1 UC が複数 F をカバーする → 全部列挙
- 1 F が複数 UC で部分検証される → 各 UC に同じ F を列挙
- どうしても E2E では検証不可能な F（バックエンドのみのジョブ等） → `e2e-scenarios.md` の冒頭に「E2E 対象外 FID リスト」セクションで明示し、理由を記述（Phase 13 で除外判定される）

## 修正モード（レビュー指摘対応・rework-loop.md 準拠）

レビューレポートのパスを渡されて起動されたら修正モードとして動作する：

1. `.agents/skills/sdlc-toolkit/references/rework-loop.md` と該当レビューレポートを Read
2. Critical / Major の**全件**に対応する（`修正済` / `代替案で対応` / `反論（根拠必須）` / `保留（ユーザー判断待ち）`。黙殺禁止）
3. 成果物を修正する
4. 対応表を `docs/40-test-plan/reviews/YYYY-MM-DD-test-planner-response-loopN.md` に書き出す（形式は rework-loop.md 参照）
5. **禁止**：指摘に触れず成果物を再提出すること／対応表なしで完了報告すること（レビュワーに NO-CHANGE で Block される）

