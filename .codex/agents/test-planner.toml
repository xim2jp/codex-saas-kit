- IaC：Checkov / tfsec

### 手動テスト
- OWASP Top 10 対応確認
- 認証バイパス試行
- IDOR検証
- レート制限テスト

## 3. アクセシビリティテスト

### 自動
- axe-playwright（E2E中に実行）
- Lighthouse CI
- **axe 自動チェック対象画面の宣言**：Phase 12 で e2e-usecase-tester が `@axe-core/playwright` スキャンを実装する対象画面（LP・価格ページ・新規登録・ログイン・ダッシュボード等の Critical 画面）をここで明示リスト化する。詳細実装は `.agents/skills/e2e-browser-testing/references/accessibility-and-visual.md` 参照

### 手動
