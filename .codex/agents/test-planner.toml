- **負荷試験**：k6 による smoke / average load / spike の3シナリオを基本とする。詳細は `.agents/skills/resilience-testing/SKILL.md`（`references/load-testing-k6.md`）を参照し、Vercel/Supabase 無料枠を踏まえた現実的な目標値をここに記載する
- **障害耐性**：MVP は主要3シナリオ（Supabase 停止時・Stripe API 障害時・AI API レート制限/障害時のフォールバック動作）で十分。詳細は `resilience-testing` Skill の `references/failure-scenarios.md` を参照し、案件固有の必須シナリオをここに列挙する

