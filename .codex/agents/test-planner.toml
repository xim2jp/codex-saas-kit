# テストケース一覧

テストケースIDの命名規則：`TC-<カテゴリ>-<連番>` 例：TC-AUTH-001

## カテゴリ別テストケース

### AUTH（認証・認可）

#### TC-AUTH-001: LINEログイン正常系

- **関連機能ID**: F-AUTH-001
- **テスト種別**: E2E
- **優先度**: Critical
- **前提条件 (Given)**:
  - 未ログインのユーザー
  - LINEアカウント存在
- **操作 (When)**:
  - 「LINEでログイン」ボタンをクリック
  - LINE認証画面で承認
- **期待結果 (Then)**:
  - ダッシュボード画面に遷移
  - users テーブルに該当レコードが存在
  - セッション cookie が HttpOnly/Secure
- **クリーンアップ**: テストユーザー削除

#### TC-AUTH-002: LINEログイン認証失敗

- **関連機能ID**: F-AUTH-001
- **テスト種別**: E2E
- **優先度**: Critical
- **Given**: LINE認証画面で拒否したケース
- **When**: 拒否を選択
- **Then**:
  - エラー画面に遷移
  - エラーメッセージ表示
  - users テーブルに変更なし

#### TC-AUTH-003: セッション期限切れ

#### TC-AUTH-004: 権限不足アクセス

