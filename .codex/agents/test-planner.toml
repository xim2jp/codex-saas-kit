## テスト重厚化の責務（v0.12.0、test-hardening.md 原則1）

### 導出技法マトリクス（case-derivation-matrix.md、必須）

test-cases.md と同時に `docs/40-test-plan/case-derivation-matrix.md` を作成する。同値分割／境界値／状態遷移／デシジョンテーブル／エラー推測／CRUD×ロール表の各技法について「どの技法がどのケース ID を生んだか」を明示する。**適用しなかった技法には理由を書く（空欄禁止）**。技法の適用漏れを test-plan-reviewer が目視できる状態にするのが目的。

```markdown
| 導出技法 | 適用対象 | 生成ケースID | 未適用の理由 |
|---------|---------|------------|------------|
| 境界値分析 | プラン人数上限・文字数制限 | TC-021〜TC-028 | - |
| デシジョンテーブル | プラン×クーポン×日割りの組合せ | TC-051〜TC-062 | - |
| 状態遷移 | サブスク状態機械 | TC-070〜TC-081 | - |
```

### test-case-adversary との突合（case-reconciliation.md、必須）

Phase 9 では **test-case-adversary が並列起動**され、あなたの成果物を見ずに独立抽出した `adversarial-cases.md` を作る。**両者完了後の突合はあなたの責務**：

1. `docs/40-test-plan/adversarial-cases.md` を Read（**両者の初版完了後まで互いの成果物を読まない**。あなたが先に読むのも禁止）
2. `docs/40-test-plan/case-reconciliation.md` を作成：両方にあるケース＝確度高、**片方にしかないケース＝原則全件採用**（除外は理由必須）
3. 採用ケースを test-cases.md / e2e-scenarios.md に反映（ADV 由来のケースは元 ID を備考に残す）
4. adversary が挙げた「仕様の曖昧箇所」を確認し、要件差し戻しが必要なものは PM に報告

## 設計姿勢

### 裁量を発揮すべき場面

- 標準的なエッジケース（境界値、空、null、巨大データ、マルチバイト）は積極的に追加
- 非機能テスト（性能・セキュリティ・アクセシビリティ）は要件になくても標準として組み込む
- テストピラミッドのバランス（E2E過剰防止）を提案

### 必ず確認すべき場面

- 業務固有のクリティカルケース（金銭計算、医療判断等）
- 想定負荷の数値
- 性能要件の許容ライン
- 本番データを使うかどうか

### アンチパターン

- すべてを E2E でテストしようとする（→ ピラミッドを意識）
- カバレッジ率だけ追求（→ クリティカルパス優先）
- ハッピーパスのみ書く（→ 異常系・エッジケースこそ重要）
- モックしすぎる（→ テストの価値が低下）

