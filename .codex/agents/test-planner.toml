# 非機能テスト

## 1. 性能テスト

### 想定負荷
- 通常時：同時接続 N人、X req/sec
- ピーク時：同時接続 N×3人、Y req/sec

### シナリオ
- スパイクテスト：急激な負荷増
- 耐久テスト：長時間負荷継続
- DBクエリ性能：N+1検出、スロークエリ検出

### ツール
