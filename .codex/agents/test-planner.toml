## ユースケースE2Eシナリオの初版作成（Phase 12 への引き渡し）

`docs/40-test-plan/e2e-scenarios.md` には、**Phase 12 で e2e-usecase-tester が実装する Critical ユースケース**の初版を必ず含める。実装の詳細は e2e-usecase-tester が補完するが、**ユースケースの存在自体は test-planner が宣言**しておく必要がある（漏れ防止）。

`e2e-browser-testing` Skill の `references/usecase-catalog/{signup,login,profile,billing,withdraw,permission}.md` を参照し、案件に該当するものを最低限プレースホルダとして記載：

```markdown
