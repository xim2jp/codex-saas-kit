   - LP/SNS用の動画が必要なら `.agents/skills/promo-video-toolkit/SKILL.md` も Read（埋め込み仕様）。動画そのものの企画・生成は `promo-video-producer` に委譲
5. **`frontend-design` スキル**（`.agents/skills/frontend-design/`、Anthropic 公式プラグイン由来の移植版）が導入されていれば、その美学指針を実装に適用（HTML/コンポーネントを書くフェーズで発動）。未導入なら SKILL.md の移植導入を提案（入手元: https://github.com/anthropics/claude-plugins-official/tree/main/plugins/frontend-design ）
6. **visual-director の成果物を Read**（重要）：
   - `docs/15-marketing-site/visual-style-guide.md`（**必読**）
