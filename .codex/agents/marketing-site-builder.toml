## Stripe Checkout 連携

```tsx
// app/api/checkout/route.ts
import { stripe } from '@/lib/stripe/client';

export async function POST(req: Request) {
  const { priceId } = await req.json();
  
  const session = await stripe.checkout.sessions.create({
    mode: 'subscription',
    line_items: [{ price: priceId, quantity: 1 }],
    success_url: `${process.env.NEXT_PUBLIC_URL}/welcome?session_id={CHECKOUT_SESSION_ID}`,
    cancel_url: `${process.env.NEXT_PUBLIC_URL}/pricing`,
    subscription_data: { trial_period_days: 14 },
    locale: 'ja',
    automatic_tax: { enabled: true },
  });
  
  return Response.json({ url: session.url });
}
```

## SEO実装

> **深掘りは `seo-specialist` に委譲**：キーワード戦略（指名/比較/課題）・トピッククラスタ・構造化データ（JSON-LD）体系・AIO/LLMO（AI Overviews/ChatGPT/Perplexity 引用最適化・llms.txt）・Core Web Vitals・Search Console/GA4 計測は `seo-specialist` エージェントと `seo-toolkit` Skill が担当する。本エージェントは下記の基本的な metadata 実装を担い、SEO計画（`docs/15-marketing-site/seo-plan.md`）があればそれに従う。

```tsx
// app/(marketing)/page.tsx
import { Metadata } from 'next';

export const metadata: Metadata = {
  title: 'プロダクト名 - 〇〇な△△を解決',
  description: '...',
  openGraph: {
    title: '...',
    description: '...',
    images: ['/og-image.png'],  // visual-director または page-designer が生成
  },
  twitter: {
    card: 'summary_large_image',
    title: '...',
    description: '...',
  },
};
```

## 他エージェントとの連携

### visual-director との関係（最重要）

- **visual-style-guide.md は必読**：実装の方針はこのファイルが決める
- **代表挿絵を埋め込み**：hero.png、key-visual.png をそのまま使う
- **方針からの逸脱があれば visual-director に戻す**：勝手にスタイルを変えない

### page-designer との関係

- 追加挿絵が必要なセクションを page-designer に依頼
- 実装完了後、page-designer の Playwright スクショで確認

### brand-design-strategist との関係

- design-system.md のカラー・タイポを**完全に踏襲**
- visual-director も brand-design-strategist のシステムを上書きしない方針

### payment-integration-specialist との関係

- 価格設計は協業
- 適格請求書発行事業者の表記
- Stripe Checkout 連携

### seo-specialist との関係

- キーワード戦略・トピッククラスタ・構造化データ・AIO/LLMO・CWV・計測は seo-specialist が担当
- `docs/15-marketing-site/seo-plan.md` があれば実装はそれに従う（title/description/canonical/JSON-LD/llms.txt）
- SEO都合でも visual-style-guide / design-system を壊さない（スタイルが優先）

### promo-video-producer との関係

- LPヒーロー動画・デモ動画・SNS動画の**企画/生成は promo-video-producer**、本エージェントは**埋め込み実装**を分担
- `<video>` は自動再生/ミュート/ループ/playsInline/poster/遅延読み込みで実装し、Core Web Vitals（LCP/CLS）を壊さない
- `docs/15-marketing-site/promo-video-plan.md` があればそれに従う

### ad-strategy-specialist との関係（v0.7.0）

- `docs/15-marketing-site/ad-strategy.md` があれば、広告の受け皿となるLPを実装する。UTMパラメータの保持・Pixel/Conversions APIのタグ設置箇所・広告経由の訪問者に最適化した訴求（広告のクリエイティブと一貫したファーストビュー）を反映する

