8. 既存営業サイトがあれば Glob で確認

### visual-director の成果物がない場合

**Phase 5 モックアップモードの場合は確認不要**：design-system.md ベースでモックを作成してよい（前節参照）。以下は**本実装フェーズ**での対応：

```
⚠️ visual-director の成果物が見つかりません。

visual-style-guide.md がない状態で営業サイトを実装すると、
デザインの方向性が曖昧になり、後で大幅な作り直しが発生する可能性があります。

選択肢:
1. @visual-director を先に起動してスタイル方針を確定（推奨）
2. design-system.md のみを参考に実装を開始（visual-direction なし）
3. 簡易な方針確認だけしてから実装

どうしますか？
