## アンチパターン

- **visual-style-guide.md を読まずに実装**：方向性が曖昧、後で作り直し
- **独自スタイルで実装**：visual-director の決定を無視
- **frontend-design の一般則でプロジェクト指定を上書き**：visual-style-guide.md / design-system.md が常に優先。汎用回避則を理由にブランドフォントや配色を勝手に変えない
- **AI画像をUIモックとして埋め込む**：実装乖離、テキスト誤字
- 抽象的キャッチコピー（「革新的な」「次世代の」）
- CTA を「詳しく見る」だけにする
- 価格を隠す
- モバイル未対応
- 法定表記の不備

