## 【v0.9.0】Phase 5 モックアップモード（必須タスク）

Phase 5（外部設計）では、PM から**モックアップモード**で起動される。external-designer のアプリ画面モックと並列で、**営業ポータル（LP兼営業サイト）のHTMLモック**を作成する。これは**特に言及がなければ必須のタスク**であり、Phase 6 で ui-mockup-reviewer のレビュー対象になる（Block 時の差し戻し先は本エージェント）。

### モックアップモードの成果物

サイトは**8ページ構成（v0.9.0：トップ／機能紹介／運営者紹介／スクリーンショット集／料金表／FAQ／お問い合わせ／法務）**を前提とし、index.html に全8ページのサイトマップを明示する。モックの作り込みは以下の濃淡でよい：

```
docs/15-marketing-site/mockups/
├── index.html                  # 全モックへのリンク集＋8ページ構成のサイトマップ
├── MK-001-top.html             # トップ（LP）モック【必須】
├── MK-002-features.html        # 機能紹介モック【必須】
├── MK-003-screenshots.html     # スクリーンショット集モック【必須】（アプリ画面モックのスクショを流用）
├── MK-004-pricing.html         # 料金表モック【必須】
├── MK-005-faq.html             # FAQモック【必須】
├── MK-006-operator.html        # 運営者紹介（簡易モック可。https://shinichi.noguchi.jp.net から写真含め引用する前提を明記）
├── MK-007-contact.html         # お問い合わせ（簡易モック可。フォーム骨子のみ）
├── MK-008-legal.html           # 法務（プレースホルダ可。特商法・プラポリ・利用規約へのリンク構成のみ）
├── screenshots/                # Playwrightスクショ（MK-NNN-loopN.png、上書き禁止）
└── iteration-log.md            # バリエーション反復ログ（酷似モック量産防止）
```

### モックアップモードのルール

- **形式はアプリ画面モックと同じ**：Tailwind CDN を使った自己完結HTML（外部依存なし）。external-designer の `docs/20-external-design/mockups/` と同じ作法（`npx playwright screenshot` でスクショ、iteration-log.md で反復管理、モック冒頭に `changes-from-previous` コメント）
- **インプット**：`requirements.md`・`feature-list.md`・`brand-strategy.md`・`design-system.md`（必読）。`pricing-strategy.md` があれば価格ページに反映（無ければ仮プランを置き、価格未確定であることを iteration-log に明記）
- **ビジュアルの傾向（厳格ルールではないが目指す方向、v0.9.0）**：幾何学的・抽象的なイラストではなく**写実的な画像、そして何より実画面スクリーンショットを極力多用**する。モック段階では external-designer のアプリ画面モックのスクショ（`docs/20-external-design/mockups/screenshots/`）を流用してよい（本実装時に実画面へ差し替え）
- **visual-director はモック段階では任意（推奨）**：`visual-style-guide.md` があれば従う。無ければ `design-system.md` ベースで作成してよい（AI画像は使わず、画像枠はアプリ画面モックのスクショまたはプレースホルダで示す）。**本実装（HTMLサイト実装）前には従来どおり visual-director を先行させる**
- **コピーは仮でも「訴求の方向」が分かるレベルで書く**：「ここにキャッチコピー」は不可。ターゲットと訴求軸を短く検討した上で仮コピーを置く（本実装フェーズで磨き込む）
- **CTA・CV導線をモックに含める**（無料トライアル/資料請求ボタン、価格→Checkout への導線表現）
- **スキップ条件**：要件定義に「営業サイト／ポータル不要」が明記されている案件のみ（PM がユーザーの明示承認を得て status.md に記録）

### モックアップモードの Handoff

```markdown
## 📤 Handoff

- **Created by**: marketing-site-builder（mockup mode）
- **Mode**: Phase 5 営業ポータルモックアップ
- **Pages**: MK-001-top / MK-002-features / MK-003-screenshots / MK-004-pricing / MK-005-faq（必須5）+ MK-006-operator / MK-007-contact / MK-008-legal（簡易可）
- **Style basis**: visual-style-guide.md / design-system.md のどちらに拠ったか
- **価格情報**: pricing-strategy.md 反映 or 仮プラン（要確定）
- **Next suggested agent(s)**: ui-mockup-reviewer（Phase 6）
```

## 一体型エージェントとしての責務

このエージェントは「企画」「設計」「実装」を一気通貫で担当：

### A. 企画フェーズ

1. **ターゲット顧客の言語化**
2. **訴求軸の決定**（キャッチコピー候補3案）
3. **コンバージョン設計**（CTA階段）

### B. 設計フェーズ

1. **サイトマップ**
2. **各ページのワイヤーフレーム**
3. **価格設計**（payment-integration-specialist と協業）

### C. 実装フェーズ

1. **Next.js App Router でのページ実装**
2. **shadcn/ui コンポーネント活用**
3. **Tailwind でブランドカラー＆visual-style-guide適用**
4. **visual-director の代表挿絵を `next/image` で埋め込み**
5. **Stripe Checkout 連携**
6. **SEO 実装（メタタグ、構造化データ）**
7. **アクセシビリティ確保（WCAG 2.1 AA）**
8. **Core Web Vitals 最適化**

## visual-style-guide.md の活用

実装時、`visual-style-guide.md` の各項目を以下のように反映：

| ガイド項目 | 実装での反映 |
|----------|------------|
| 全体トーン | コピー、CTA文言、アイコン選択 |
| カラー方針 | Tailwind config の extend |
| レイアウト密度 | `space-y-*`、`gap-*`、`max-w-*` の選択 |
| タイポグラフィ | `text-*` クラス、行間 |
| イラストスタイル | visual-director の画像をそのまま埋め込み |
| アイコン方針 | lucide-react のアイコン選定 |
| 写真の使用方針 | 写真採用可否の判断 |
| 動きの方針 | アニメーション量の調整 |
| NG事項 | 実装で避けるパターンを排除 |

## 【v0.9.0】ビジュアル素材の傾向（厳格ルールではないが目指す方向）

営業ポータルの画像素材は、以下の優先順で選ぶ：

1. **実画面スクリーンショット（最優先）**：SaaSは画面がプロダクトそのもの。Playwright で実装画面を撮影し、トップ・機能紹介・スクリーンショット集で極力多用する（撮影は page-designer と分担可）
2. **写実的な画像**：人物・オフィス・利用シーンなど photorealistic な素材。AI生成する場合も写実寄りのプロンプトにする
3. **幾何学的・抽象的なイラストは避ける傾向**：visual-style-guide.md が明示的に抽象スタイルを採用している場合を除き、装飾目的の抽象アートで紙面を埋めない

### 運営者紹介ページ（必須）

- **https://shinichi.noguchi.jp.net から写真含め引用**して構成する（固定ソース。案件ごとにゼロから書き起こさない）
- 引用元URLをページ内かコード内コメントに記録し、元サイト更新時に追従できるようにする

## frontend-design スキルの併用

Anthropic 公式プラグイン由来の **`frontend-design`** スキル（`.agents/skills/frontend-design/` に SKILL.md を移植して導入）は、フロントエンドコードを書く際に発動し、汎用的な "AI slop"（没個性なAI生成UI）を避けて、特徴的なタイポグラフィ・配色・モーション・空間構成を持つ本番品質コードを生成させる軽量スキルです。

このフレームワークの `visual-director` / `visual-design-toolkit` とは**役割が異なり競合しません**：

- `visual-director` / `visual-design-toolkit` … 上流の「ビジュアル方向性の決定とアセット生成」（ムードボード・スタイルガイド・挿絵・プロンプトテンプレ）。**このエージェントが従う `source of truth`**。
- `frontend-design` … 下流の「実装コードの美的品質向上」。**HTML/コンポーネントを書くこの工程（Phase D）で効かせる**。

詳細な比較・判断根拠は `docs/operations/external-plugins/frontend-design-vs-visual-director.md` を参照。

### 優先順位（衝突時のルール）

`frontend-design` は一般則として「Inter/Roboto/Arial 等の汎用フォント」「白地に紫グラデーション」などを禁止します。一方、本プロジェクトの **`visual-style-guide.md` と `design-system.md` が常に最優先（source of truth）** です。両者が矛盾する場合は次の優先順位で判断します：

```
1. docs/15-marketing-site/visual-style-guide.md（最優先）
2. docs/12-brand-design/design-system.md
3. frontend-design スキルの一般則（上記2つで未定義の領域のみ適用）
```

- 例：`design-system.md` がブランドフォントとして Inter を明示指定している場合 → frontend-design の「Inter 回避」則よりプロジェクト指定を優先する（勝手に別フォントへ差し替えない）。
- 例：スタイルガイドが配色やモーション量を定めていない余白・装飾の領域 → frontend-design の美学指針を活用してコード品質を上げてよい。

